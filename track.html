<body>
  <header class="site-header" id="site-header"></header>

    <p data-i18n="track_intro"></p>

  <main class="container" style="padding-bottom:60px;max-width:720px">
    <div class="co-card">
      <div class="field"><label data-i18n="track_id"></label><input id="tId" inputmode="numeric" placeholder="1001"></div>

      <p class="co-error" id="tError"></p>
      <button class="btn accent" id="tBtn" style="width:100%" data-i18n="track_btn"></button>
    </div>
    <div class="co-card" id="tResult" hidden style="margin-top:20px"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
