  <header class="site-header" id="site-header"></header>

  <!-- HERO -->
  <section class="hero">
    <img class="hero-bg" id="hero-img" alt="">
    <div class="container hero-inner">
      <span class="hero-kicker" data-i18n="hero_kicker"></span>
      <h1 data-i18n="hero_title"></h1>

    <div class="split">
      <div class="split-body">
        <span class="kicker" data-i18n="intro_kicker"></span>
        <h2 data-i18n="intro_title"></h2>
        <p data-i18n="intro_body"></p>

  <!-- FEATURED -->

    <div class="section-head">
      <div>
        <span class="kicker" data-i18n="feat_kicker"></span>

          <h2 data-i18n="craft_title"></h2>
          <p data-i18n="craft_sub"></p>
        </div>
        <a class="btn line" href="atelier.html" data-i18n="nav_atelier"></a>
      </div>
      <div class="steps" id="steps-home"></div>

  </section>

        <a href="atelier.html" class="btn ghost" style="border-color:#e8b58e;color:#e8b58e" data-i18n="heritage_cta"></a>

  <section class="section container">

    <div class="gal-strip" id="gal-strip"></div>

    <div class="container cta-inner">
      <span class="kicker" style="justify-content:center" data-i18n="cta_kicker"></span>
      <h2 data-i18n="cta_title"></h2>
